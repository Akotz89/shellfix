name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained single-file
        run: |
          dotnet publish shim/PowerShellShim.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o shim/publish `
            --nologo

      - name: Verify output
        run: |
          $exe = "shim/publish/powershell.exe"
          if (-not (Test-Path $exe)) { Write-Error "Build failed"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "Built: powershell.exe ($size MB)"
        shell: pwsh

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate SHA256 checksums
        run: |
          $assets = @(
            "shim/publish/powershell.exe",
            "install.ps1",
            "profile/Microsoft.PowerShell_profile.ps1",
            "launch-ide.bat"
          )
          $checksums = @()
          foreach ($file in $assets) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $file -Leaf
            $checksums += "$hash  $name"
          }
          $checksums | Out-File -FilePath checksums.txt -Encoding utf8NoBOM
          Write-Host "Generated checksums:"
          Get-Content checksums.txt
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "shellfix ${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            shim/publish/powershell.exe
            install.ps1
            profile/Microsoft.PowerShell_profile.ps1
            launch-ide.bat
            checksums.txt
