name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true

jobs:
  release:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained shim
        run: |
          dotnet publish shim/PowerShellShim.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o shim/publish `
            --nologo

      - name: Build self-contained CLI
        run: |
          dotnet publish src/Shellfix.Cli/Shellfix.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o src/Shellfix.Cli/publish `
            --nologo

      - name: Verify output
        run: |
          $assets = @("shim/publish/powershell.exe", "src/Shellfix.Cli/publish/shellfix.exe")
          foreach ($exe in $assets) {
            if (-not (Test-Path $exe)) { Write-Error "Build failed: $exe"; exit 1 }
            $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
            Write-Host "Built: $exe ($size MB)"
          }
        shell: pwsh

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate SHA256 checksums
        run: |
          $assets = @(
            "shim/publish/powershell.exe",
            "src/Shellfix.Cli/publish/shellfix.exe",
            "install.ps1",
            "profile/Microsoft.PowerShell_profile.ps1",
            "launch-ide.bat"
          )
          $checksums = @()
          foreach ($file in $assets) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $file -Leaf
            $checksums += "$hash  $name"
          }
          $checksums | Out-File -FilePath checksums.txt -Encoding utf8NoBOM
          Write-Host "Generated checksums:"
          Get-Content checksums.txt
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "shellfix ${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            shim/publish/powershell.exe
            src/Shellfix.Cli/publish/shellfix.exe
            install.ps1
            profile/Microsoft.PowerShell_profile.ps1
            launch-ide.bat
            checksums.txt
