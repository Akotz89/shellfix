name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build shim
        run: dotnet publish shim/PowerShellShim.csproj -c Release -o shim/out --nologo

      - name: Build CLI
        run: |
          dotnet publish src/Shellfix.Cli/Shellfix.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o src/Shellfix.Cli/out `
            --nologo

      - name: Verify build output
        run: |
          if (Test-Path "shim/out/powershell.exe") {
            Write-Host "Build succeeded: shim/out/powershell.exe exists"
            $size = (Get-Item "shim/out/powershell.exe").Length
            Write-Host "Size: $([math]::Round($size / 1MB, 2)) MB"
          } else {
            Write-Error "Build failed: powershell.exe not found"
            exit 1
          }
        shell: pwsh

      - name: Run functional smoke tests
        run: .\test-ci-smoke.ps1 -ShimPath .\shim\out\powershell.exe
        shell: pwsh

      - name: Run CLI self-tests
        run: .\src\Shellfix.Cli\out\shellfix.exe test
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: shellfix-binaries
          path: |
            shim/out/powershell.exe
            src/Shellfix.Cli/out/shellfix.exe
          retention-days: 30
