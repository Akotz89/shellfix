<svg width="920" height="220" viewBox="0 0 920 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shellfix</title>
  <desc id="desc">Stop PowerShell from breaking AI agent commands</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#1D76DB"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="916" height="216" rx="24" fill="url(#panel)" stroke="#1E3A5F" stroke-width="2"/>
  <path d="M34 160H886" stroke="#123B63" stroke-width="1"/>

  <g transform="translate(54 52)" filter="url(#softGlow)">
    <path d="M8 26L42 60L8 94" stroke="url(#blue)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M76 98H132" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g transform="translate(230 42)">
    <text x="0" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="0" fill="#F8FAFC">Shell<tspan fill="url(#blue)">fix</tspan></text>
    <text x="2" y="124" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#CBD5E1">Stop PowerShell from breaking AI agent commands</text>
  </g>

  <g transform="translate(230 174)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">
    <circle cx="8" cy="-6" r="5" fill="#22C55E"/>
    <text x="22" y="0">WSL routing</text>
    <circle cx="154" cy="-6" r="5" fill="#22C55E"/>
    <text x="168" y="0">native tools</text>
    <circle cx="304" cy="-6" r="5" fill="#22C55E"/>
    <text x="318" y="0">clean stderr</text>
    <circle cx="450" cy="-6" r="5" fill="#22C55E"/>
    <text x="464" y="0">UTF-8</text>
    <circle cx="548" cy="-6" r="5" fill="#22C55E"/>
    <text x="562" y="0">no ANSI noise</text>
  </g>
</svg>
