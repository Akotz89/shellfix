<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shellfix</title>
  <desc id="desc">Stop PowerShell from breaking AI agent commands</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101D"/>
      <stop offset="0.55" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#1D76DB"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="1277" height="317" rx="28" fill="url(#bg)" stroke="#1E3A5F" stroke-width="3"/>
  <path d="M1040 38H1198" stroke="#0F2745" stroke-width="2"/>
  <path d="M70 78H230" stroke="#0F2745" stroke-width="2"/>

  <g transform="translate(88 74)" filter="url(#glow)">
    <path d="M18 30L74 86L18 142" stroke="url(#blue)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 148H210" stroke="url(#blue)" stroke-width="28" stroke-linecap="round"/>
  </g>

  <g transform="translate(360 78)">
    <text x="0" y="92" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="96" font-weight="850" letter-spacing="0" fill="#F8FAFC">Shell<tspan fill="url(#blue)">fix</tspan></text>
    <text x="4" y="150" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="0" fill="#E2E8F0">Stop PowerShell from breaking AI agent commands</text>
  </g>

  <path d="M364 246H998" stroke="#123B63" stroke-width="2"/>
</svg>
